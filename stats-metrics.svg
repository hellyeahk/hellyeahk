<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-label="GitHub Activity Metrics">
  <defs>
    <radialGradient id="crimsonCard" cx="30%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#A81918" />
      <stop offset="100%" stop-color="#620A09" />
    </radialGradient>
    <radialGradient id="darkCard" cx="50%" cy="50%" r="85%">
      <stop offset="0%" stop-color="#240404" />
      <stop offset="100%" stop-color="#120202" />
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="386" height="168" rx="12" fill="url(#crimsonCard)" stroke="#87100F" stroke-width="1.5" />
  <text x="24" y="30" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" letter-spacing="1.5" fill="#F5EFE6" fill-opacity="0.88">[ CONTRIBUTIONS ]</text>
  <text x="24" y="114" font-family="'Helvetica Neue', 'Arial Black', Arial, sans-serif" font-size="68" font-weight="900" letter-spacing="-3" fill="#F5EFE6">239</text>
  <text x="24" y="150" font-family="'Courier New', Courier, monospace" font-size="10.5" letter-spacing="1.2" fill="#F5EFE6" fill-opacity="0.78">LAST 12 MONTHS // ALL ACTIVITY</text>

  <rect x="397" y="1" width="296" height="168" rx="12" fill="url(#darkCard)" stroke="#5C0908" stroke-width="1.5" />
  <text x="420" y="30" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" letter-spacing="1.5" fill="#E63946">CURRENT STREAK</text>
  <text x="420" y="114" font-family="'Helvetica Neue', 'Arial Black', Arial, sans-serif" font-size="68" font-weight="900" letter-spacing="-3" fill="#F5EFE6">0</text>
  <text x="420" y="150" font-family="'Courier New', Courier, monospace" font-size="10.5" letter-spacing="1.2" fill="#F5EFE6" fill-opacity="0.65">DAYS IN A ROW</text>

  <rect x="703" y="1" width="296" height="168" rx="12" fill="#F5EFE6" stroke="#F5EFE6" stroke-width="1.5" />
  <text x="726" y="30" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" letter-spacing="1.5" fill="#87100F">LONGEST STREAK</text>
  <text x="726" y="114" font-family="'Helvetica Neue', 'Arial Black', Arial, sans-serif" font-size="68" font-weight="900" letter-spacing="-3" fill="#87100F">2</text>
  <text x="726" y="150" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#5C0908">DAYS // LAST 12 MONTHS</text>

  <rect x="1" y="179" width="242" height="130" rx="12" fill="url(#darkCard)" stroke="#5C0908" stroke-width="1.5" />
  <text x="20" y="205" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#E63946">PUBLIC REPOS</text>
  <text x="20" y="260" font-family="'Helvetica Neue', 'Arial Black', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-2" fill="#F5EFE6">17</text>
  <text x="20" y="292" font-family="'Courier New', Courier, monospace" font-size="9.5" letter-spacing="1" fill="#F5EFE6" fill-opacity="0.62">ORIGINAL, NON-FORK</text>

  <rect x="253" y="179" width="242" height="130" rx="12" fill="url(#crimsonCard)" stroke="#87100F" stroke-width="1.5" />
  <text x="272" y="205" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#F5EFE6" fill-opacity="0.88">TOTAL STARS</text>
  <text x="272" y="260" font-family="'Helvetica Neue', 'Arial Black', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-2" fill="#F5EFE6">0</text>
  <text x="272" y="292" font-family="'Courier New', Courier, monospace" font-size="9.5" letter-spacing="1" fill="#F5EFE6" fill-opacity="0.78">ACROSS PUBLIC REPOS</text>

  <rect x="505" y="179" width="242" height="130" rx="12" fill="url(#darkCard)" stroke="#5C0908" stroke-width="1.5" />
  <text x="524" y="205" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#E63946">FOLLOWERS</text>
  <text x="524" y="260" font-family="'Helvetica Neue', 'Arial Black', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-2" fill="#F5EFE6">0</text>
  <text x="524" y="292" font-family="'Courier New', Courier, monospace" font-size="9.5" letter-spacing="1" fill="#F5EFE6" fill-opacity="0.62">ON GITHUB</text>

  <rect x="757" y="179" width="242" height="130" rx="12" fill="#F5EFE6" stroke="#F5EFE6" stroke-width="1.5" />
  <text x="776" y="205" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#87100F">TOP LANGUAGE</text>
  <text x="776" y="254" font-family="'Helvetica Neue', 'Arial Black', Arial, sans-serif" font-size="27" font-weight="900" letter-spacing="-1" fill="#87100F">JAVASCRIPT</text>
  <text x="776" y="292" font-family="'Courier New', Courier, monospace" font-size="9.5" font-weight="700" letter-spacing="1" fill="#5C0908">MOST CODE WRITTEN</text>
</svg>
