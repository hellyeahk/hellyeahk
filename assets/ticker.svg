<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="44" viewBox="0 0 1000 44" role="img" aria-label="Interactive canvas, visual web experiments, generative art, UI engineering">
  <defs>
    <linearGradient id="tk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5C0908"/><stop offset="0.5" stop-color="#87100F"/><stop offset="1" stop-color="#5C0908"/>
    </linearGradient>
    <clipPath id="tkc"><rect width="1000" height="44" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#tkc)">
    <rect width="1000" height="44" fill="url(#tk)"/>
    <line x1="0" y1="6" x2="1000" y2="6" stroke="#F5EFE6" stroke-opacity="0.2"/>
    <line x1="0" y1="38" x2="1000" y2="38" stroke="#F5EFE6" stroke-opacity="0.2"/>
    <g font-family="'Courier New', Courier, monospace" font-size="14" font-weight="700" fill="#F5EFE6" fill-opacity="0.92">
      <text x="0" y="27" textLength="960" lengthAdjust="spacing">INTERACTIVE CANVAS // VISUAL WEB EXPERIMENTS // GENERATIVE ART // UI ENGINEERING // PROCEDURAL FLORA // </text>
      <text x="960" y="27" textLength="960" lengthAdjust="spacing">INTERACTIVE CANVAS // VISUAL WEB EXPERIMENTS // GENERATIVE ART // UI ENGINEERING // PROCEDURAL FLORA // </text>
      <text x="1920" y="27" textLength="960" lengthAdjust="spacing">INTERACTIVE CANVAS // VISUAL WEB EXPERIMENTS // GENERATIVE ART // UI ENGINEERING // PROCEDURAL FLORA // </text>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-960 0" dur="26s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
