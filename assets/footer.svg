<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="125" viewBox="0 0 1000 125" role="img" aria-label="Curated Web Archive">
  <defs>
    <radialGradient id="footerPoster" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#9E1615" />
      <stop offset="100%" stop-color="#620A09" />
    </radialGradient>
    <filter id="chalkFooter" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.15" numOctaves="2" seed="4" result="turb" />
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <clipPath id="fPosterClip"><rect width="1000" height="125" rx="16" /></clipPath>
  </defs>

  <g clip-path="url(#fPosterClip)">
    <rect width="1000" height="125" fill="url(#footerPoster)" />
    <line x1="36" y1="24" x2="964" y2="24" stroke="#F5EFE6" stroke-opacity="0.16" stroke-width="1" />
    <line x1="36" y1="101" x2="964" y2="101" stroke="#F5EFE6" stroke-opacity="0.16" stroke-width="1" />

    
    <g transform="translate(88, 62)" filter="url(#chalkFooter)" stroke="#F5EFE6" stroke-width="3.5" stroke-linecap="round">
      <line x1="-18" y1="0" x2="18" y2="0" />
      <line x1="0" y1="-18" x2="0" y2="18" />
      <line x1="-13" y1="-13" x2="13" y2="13" />
      <line x1="-13" y1="13" x2="13" y2="-13" />
    </g>
    <g transform="translate(912, 62)" filter="url(#chalkFooter)" stroke="#F5EFE6" stroke-width="3.5" stroke-linecap="round">
      <line x1="-18" y1="0" x2="18" y2="0" />
      <line x1="0" y1="-18" x2="0" y2="18" />
      <line x1="-13" y1="-13" x2="13" y2="13" />
      <line x1="-13" y1="13" x2="13" y2="-13" />
    </g>

    <text x="500" y="64" text-anchor="middle" font-family="&#39;Helvetica Neue&#39;, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="-1.2" fill="#F5EFE6">
      INTERACTIVE VISUAL LAB // ARCHIVE
    </text>
    <text x="500" y="88" text-anchor="middle" font-family="&#39;Courier New&#39;, Courier, monospace" font-size="11" letter-spacing="2.2" fill="#F5EFE6" fill-opacity="0.82">
      @HELLYEAHK · TG: @YUFANZUAO · INTERACTIVE CANVAS
    </text>
  </g>
</svg>
