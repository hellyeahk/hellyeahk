name: Generate Profile Assets

# Builds the contribution snake + brutalist stats tiles and publishes them
# to the `output` branch. README reads them from there.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake from contribution graph (crimson palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=%232A0505&color_dots=%23E8DDCB,%23D9908F,%23B33A39,%23872020,%235C0908
            dist/snake-dark.svg?color_snake=%23F5EFE6&color_dots=%23241010,%235C0908,%23872020,%23B33A39,%23E06B69

      - name: Generate stats tiles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: python3 .github/scripts/stats.py dist

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
